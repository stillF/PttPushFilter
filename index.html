        function searchPtt() {
            $("#resultArea").empty();
            let _UrlData = checkUrl();
            if (!_UrlData["status"]) {
                toastr.error("網址格式錯誤，請重新輸入。");
                return false;
            }
            if (_UrlData["urlType"] === 1) {
                setResultDataByType1(_UrlData["pttUrl"]);
            } else if (_UrlData["urlType"] === 2) {
                setResultDataByType2(_UrlData["pttUrl"]);
            } else if (_UrlData["urlType"] === 3) {
                setResultDataByType3();
            } else if (_UrlData["urlType"] === 4) {
                setResultDataByType4();
            } else if (_UrlData["urlType"] === 5) {
                setResultDataByType5();
            }
        }

        function setResultDataByType1(_Ptturl) { //ptt.cc搜尋
            $("#loadingModal").modal("show");
            let _pushData = [];
            let _userId = "";
            let _pushContent = "";
            let _searchIndex = -1;
            let _html = "";
            $.ajax({
                //url: 'https://cors-anywhere.herokuapp.com/' + _Ptturl,
                url: 'https://secret-ocean-49799.herokuapp.com/' + _Ptturl,
                dataType: 'html',
                success: function(data) {
                    if ($(data).find('.over18-notice p').length > 0) {
                        $("#resultArea").append("over18=1;");
                        return false;
                    }

                    let pushData = $(data).find('div.push');
                    let _length = pushData.length;
                    let _item = null;
                    for (i = 0; i < _length; i++) {
                        _item = $(pushData).eq(i);
                        _userId = jQuery.trim($(_item).find(".push-userid").text());
                        _searchIndex = _pushData.findIndex((obj => obj.userId === _userId));
                        if (_searchIndex !== -1) {
                            _pushContent = _pushData[_searchIndex]["pushContent"];
                            _pushContent += ($(_item).find(".push-content").text()).replace(": ", "") + "<span style='color:#c8c8c8;float:right;'>#" + (i + 1) + "</span>" + "\n";
                            _pushData[_searchIndex]["pushContent"] = _pushContent;
                        } else {
                            _pushData.push({
                                userId: _userId,
                                pushContent: ($(_item).find(".push-content").text()).replace(": ", "") + "<span style='color:#c8c8c8;float:right;'>#" + (i + 1) + "</span>" + "\n"
                            });
                        }
                    }

                    let _iMax = _pushData.length;
                    if (_iMax > 0) {
                        let searchPttID = jQuery.trim($("#pttID").val());
                        if (searchPttID === "") {
                            for (i = 0; i < _iMax; i++) {
                                _html += "<span># " + (i + 1) + "【" + _pushData[i]['userId'] + "】</span>";
                                _html += "<pre>" + _pushData[i]['pushContent'] + "</pre>";
                            }
                        } else {
                            _searchIndex = _pushData.findIndex((obj => obj.userId === searchPttID));
                            if (_searchIndex !== -1) {
                                _html += "<span># 1【" + _pushData[_searchIndex]['userId'] + "】</span>";
                                _html += "<pre>" + _pushData[_searchIndex]['pushContent'] + "</pre>";
                            } else {

                            }
                        }
                        $("#resultArea").append(_html);
                    } else {

                    }
                },
                complete: function() {
                    $("#loadingModal").modal("hide");
                },
                statusCode: {
                    404: function() {
                        $("#resultArea").append("404 not found");
                    }
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    console.log(textStatus + ": " + jqXHR.status + " ");
                }
            });
        }

        function getYoutubeImageUrl(txt) {
            if (!videoUrl.startsWith("https://")) {
                return "";
            }
            const videoId = videoUrl.match(
                /(?:youtu\.be\/|youtube\.com\/(?:.*[?&]v=|embed\/|v\/))([0-9A-Za-z_-]{11})/
            );
            return videoId ? `https://img.youtube.com/vi/${videoId[1]}/hqdefault.jpg` : "";
        }

        function checkImageUrl(txt) {
            if (typeof txt !== "string") {
                return {
                    imageUrl: "",
                    youtubeUrl: "",
                    orgTxt: txt
                };
            }

            // YouTube 影片縮圖網址
            const videoIdMatch = txt.match(/https?:\/\/(?:youtu\.be\/|www\.youtube\.com\/(?:.*[?&]v=|embed\/|v\/))([0-9A-Za-z_-]{11})/);
            if (videoIdMatch) {
                return {
                    imageUrl: `https://img.youtube.com/vi/${videoIdMatch[1]}/hqdefault.jpg`,
                    youtubeUrl: `https://www.youtube.com/watch?v=${videoIdMatch[1]}`,
                    orgTxt: txt
                };
            }

            // 驗證是否為 HTTP 或 HTTPS 開頭
            const isValidProtocol = txt.startsWith("http:") || txt.startsWith("https:");
            // const isValidProtocol = txt.startsWith("https:");
            if (!isValidProtocol) {
                return {
                    imageUrl: "",
                    youtubeUrl: "",
                    orgTxt: txt
                };
            }

            // 驗證是否為imgur的圖片
            if (txt.startsWith("https://imgur.com/")) {
                return {
                    imageUrl: txt.replace("https://imgur.com/", "https://i.imgur.com/") + ".jpeg",
                    youtubeUrl: "",
                    orgTxt: txt
                };
            }

            // 驗證是否為圖片副檔名
            const validExtensions = [".jpg", ".jpeg", ".png", ".gif"];
            const isValidImage = validExtensions.some(ext => txt.toLowerCase().endsWith(ext));
            // 一般圖片網址
            if (isValidImage) {
                return {
                    imageUrl: txt,
                    youtubeUrl: "",
                    orgTxt: txt
                };
            }

            return {
                imageUrl: "",
                youtubeUrl: "",
                orgTxt: ""
            };
        }

                } else {
                    _html += `<a href='${_isImage.imageUrl}' target='_blank' style='font-size:25px;color:#0e4fb0;'>${_isImage.orgTxt}</a><br>`;
                    _html += `<img style="max-height:300px;max-width:100%;margin-bottom:0.5em;" src="${_isImage.imageUrl}" onclick="getImageModalHandler('${_isImage.imageUrl}')"><br>`;
                }
            }
            $("#resultArea").append(_html);
            $("#loadingModal").modal("hide");
        }

        function setResultDataByType5() { // ptt內文
            $("#loadingModal").modal("show");
            let htmlTxt = jQuery.trim($("#htmlTxt").val());
            let tempDiv = document.createElement("div");
            tempDiv.innerHTML = htmlTxt;
            const filterData1 = [];
            let stack = Array.from(tempDiv.childNodes);
            while (stack.length) {
                let node = stack.shift();
                if (node.nodeType === Node.TEXT_NODE) {
                    filterData1.push(node.textContent.trim());
                } else if (node.nodeType === Node.ELEMENT_NODE && !node.matches("span.f2, div.push, script, div.article-metaline, div.article-metaline-right, title, div#topbar-container, div#navigation-container")) {
                    stack.unshift(...Array.from(node.childNodes));
                }
            }
            const filterData2 = filterData1
                .filter(item => item.trim().length > 0)
                .map(item => item.split("\n"))
                .flat()
                .map(line => line.trim());

            let _isImage = "";
            let _html = "";
            let _item = null;
            for (let i = 0, iLen = filterData2.length; i < iLen; i += 1) {
                _item = jQuery.trim(filterData2[i]);
                if (_item !== "") {
                    _isImage = checkImageUrl(_item);
                    if (_isImage.imageUrl === "") {
                        _html += "<span style='font-size:25px;color:#c8c8c8;'>" + _item + "</span><br>";
                    } else if (_isImage.youtubeUrl !== "") {
                        _html += `<a href='${_isImage.youtubeUrl}' target='_blank' style='font-size:25px;color:#0e4fb0;'>${_isImage.orgTxt}</a><br>`;
                        _html += `<img style="max-height:300px;max-width:100%;margin-bottom:0.5em;" src="${_isImage.imageUrl}" onclick="getImageModalHandler('${_isImage.imageUrl}')"><br>`;
                    } else {
                        _html += `<a href='${_isImage.imageUrl}' target='_blank' style='font-size:25px;color:#0e4fb0;'>${_isImage.orgTxt}</a><br>`;
                        _html += `<img style="max-height:300px;max-width:100%;margin-bottom:0.5em;" src="${_isImage.imageUrl}" onclick="getImageModalHandler('${_isImage.imageUrl}')"><br>`;
                    }
                } else {
                    _html += `<br>`;
                }
            }
            $("#resultArea").append(_html);
            $("#loadingModal").modal("hide");
        }

        function checkUrl() {
            let _urlType = 3;
            let _pttUrl = jQuery.trim($("#pttUrl").val());
            let _status = true;
            const isCheckText = $("input[name='isCheckText']:checked").val() ? true : false;
            if(isCheckText){
                _pttUrl = "";
                _urlType = 4;
                _status = true;
            }
            const isCheckPttText = $("input[name='isCheckPttText']:checked").val() ? true : false;
            if(isCheckPttText){
                _pttUrl = "";
                _urlType = 5;
                _status = true;
            }            
            return result = {
                pttUrl: _pttUrl,
                urlType: _urlType,
                status: _status
            };
        }

        function cleanInput(inputName) {
            $("#" + inputName).val("");
        }

        function goToArea(type) {
            if (type === 1) {
                $('html,body').animate({
                    scrollTop: 0
                }, 1000);
            }
        }    
    </script>
</body>
